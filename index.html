<!-- ===== 招生活動行事曆（自動同步） ===== -->
<style>
  .dm-cal-card{background:#fff;border:1px solid #E3DFD3;border-radius:8px;padding:24px;margin-bottom:24px}
  .dm-cal-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .dm-cal-title{margin:0;font-size:20px;font-weight:600;color:#222831}
  .dm-cal-sub{margin:4px 0 0;font-size:13px;color:#6B7280}
  .dm-cal-ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dm-cal-btn{border:1px solid #E3DFD3;background:#fff;color:#222831;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:14px}
  .dm-cal-btn:hover{background:#F8F6F1}
  .dm-cal-btn.on{background:#02257F;color:#fff;border-color:#02257F}
  .dm-cal-legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px;font-size:13px;color:#4B5563}
  .dm-cal-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .dm-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .dm-cal-h{text-align:center;font-size:14px;font-weight:600;padding:8px 0;background:#F8F6F1;border-radius:4px;color:#222831}
  .dm-cal-d{min-height:92px;border:1px solid #E3DFD3;border-radius:6px;padding:6px;font-size:14px;background:#fff}
  .dm-cal-ev{display:block;color:#fff;border-radius:4px;padding:3px 6px;margin-top:4px;font-size:13px;font-weight:500;line-height:1.3;cursor:pointer;word-break:break-word}
  .dm-cal-ev:hover{opacity:.88}
  .dm-cal-ev.cx{opacity:.45;text-decoration:line-through}
  .dm-cal-list-row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid #E3DFD3;cursor:pointer;font-size:14px}
  .dm-cal-list-row:hover{background:#F8F6F1}
  .dm-cal-tag{padding:2px 8px;border-radius:4px;color:#fff;font-size:12px;white-space:nowrap}
  .dm-cal-mask{position:fixed;inset:0;background:rgba(2,37,127,.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
  .dm-cal-modal{background:#fff;border-radius:8px;padding:24px;max-width:480px;width:100%;box-shadow:0 12px 30px rgba(0,0,0,.2)}
  @media(max-width:768px){.dm-cal-d{min-height:60px;padding:4px;font-size:12px}.dm-cal-ev{font-size:11px;padding:2px 4px}}
</style>

<div class="dm-cal-card" id="dm-cal-widget">
  <div class="dm-cal-top">
    <div>
      <h3 class="dm-cal-title">招生活動行事曆</h3>
      <p class="dm-cal-sub">與「招生活動管理系統」即時同步（點擊活動可查看時間與地點）</p>
    </div>
    <div class="dm-cal-ctrl">
      <button class="dm-cal-btn" onclick="dmCalShift(-1)">◀</button>
      <b id="dm-cal-ym" style="min-width:105px;text-align:center;font-size:16px"></b>
      <button class="dm-cal-btn" onclick="dmCalShift(1)">▶</button>
      <button class="dm-cal-btn on" id="dm-btn-cal" onclick="dmCalView('cal')">月曆</button>
      <button class="dm-cal-btn" id="dm-btn-list" onclick="dmCalView('list')">列表</button>
    </div>
  </div>
  <div class="dm-cal-legend" id="dm-cal-legend"></div>
  <div id="dm-cal-body" style="color:#6B7280;font-size:14px">行事曆載入中...</div>
</div>
<div id="dm-cal-md"></div>

<script>
(function(){
  const API = 'https://script.google.com/macros/s/AKfycbx5qTGHijprOKEd5xbaKzt4LOHKnFtq5PX9HzCbNWmpIza7EyFKkgtB6rvHjY-_cDAi/exec';
  const TYPES = [
    ['說明會','#02257F'],['入班宣導','#2F8F45'],['博覽會','#D4A017'],['入校參訪','#7C3AED'],
    ['活動設攤','#9E2A2F'],['營隊體驗課程','#258DC4'],['介紹就讀','#65A30D'],['其他','#6B7280']
  ];
  const st = { y: new Date().getFullYear(), m: new Date().getMonth(), view: 'cal', list: [] };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  document.getElementById('dm-cal-legend').innerHTML = TYPES.map(t =>
    `<span><span class="dm-cal-dot" style="background:${t[1]}"></span>${t[0]}</span>`
  ).join('');

  window.dmCalShift = d => {
    const dt = new Date(st.y, st.m + d, 1);
    st.y = dt.getFullYear(); st.m = dt.getMonth();
    render();
  };
  window.dmCalView = v => {
    st.view = v;
    document.getElementById('dm-btn-cal').classList.toggle('on', v === 'cal');
    document.getElementById('dm-btn-list').classList.toggle('on', v === 'list');
    render();
  };
  window.dmCalShow = id => {
    const a = st.list.find(x => x.id === id);
    if (!a) return;
    const t = TYPES[a.t] || TYPES[7];
    document.getElementById('dm-cal-md').innerHTML = `
      <div class="dm-cal-mask" onclick="if(event.target===this)this.remove()">
        <div class="dm-cal-modal">
          <span class="dm-cal-tag" style="background:${t[1]}">${t[0]}</span>
          <h3 style="margin:10px 0 8px;font-size:19px">${esc(a.name)}${a.cx ? '（已取消）' : ''}</h3>
          <p style="margin:0 0 14px;line-height:1.8;font-size:15px">
            📅 日期：${esc(a.date)} ${esc(a.time || '')}<br>
            📍 地點：${esc(a.loc || '未填寫')}${a.cls || a.ppl ? `（${a.cls || 0}班／${a.ppl || 0}人）` : ''}<br>
            📝 備註：${esc(a.note || '無')}
          </p>
          <button class="dm-cal-btn on" onclick="document.getElementById('dm-cal-md').innerHTML=''">關閉</button>
        </div>
      </div>`;
  };

  function render() {
    document.getElementById('dm-cal-ym').textContent = `${st.y} 年 ${st.m + 1} 月`;
    const body = document.getElementById('dm-cal-body');
    const ym = `${st.y}-${String(st.m + 1).padStart(2, '0')}`;
    if (st.view === 'cal') {
      const f = new Date(st.y, st.m, 1).getDay(), n = new Date(st.y, st.m + 1, 0).getDate();
      let h = '<div class="dm-cal-grid">' + '日一二三四五六'.split('').map(x => `<div class="dm-cal-h">${x}</div>`).join('') + '<div></div>'.repeat(f);
      for (let d = 1; d <= n; d++) {
        const ds = `${ym}-${String(d).padStart(2, '0')}`;
        const evs = st.list.filter(a => a.date === ds);
        h += `<div class="dm-cal-d"><b>${d}</b>${evs.map(a => `<span class="dm-cal-ev ${a.cx ? 'cx' : ''}" style="background:${(TYPES[a.t]||TYPES[7])[1]}" onclick="dmCalShow('${esc(a.id)}')">${esc(a.name)}</span>`).join('')}</div>`;
      }
      body.innerHTML = h + '</div>';
    } else {
      const evs = st.list.filter(a => a.date.startsWith(ym)).sort((a, b) => a.date.localeCompare(b.date));
      body.innerHTML = evs.map(a => {
        const t = TYPES[a.t] || TYPES[7];
        return `<div class="dm-cal-list-row" onclick="dmCalShow('${esc(a.id)}')">
          <span class="dm-cal-tag" style="background:${t[1]}">${t[0]}</span>
          <span>${esc(a.date)} ${esc(a.time || '')} <b>${esc(a.name)}</b>（${esc(a.loc || '')}）${a.cx ? '【已取消】' : ''}</span>
        </div>`;
      }).join('') || '<p style="color:#6B7280;margin:8px 0">本月無招生活動</p>';
    }
  }

  fetch(API, { method: 'POST', body: JSON.stringify({ action: 'getCalendar' }) })
    .then(r => r.json())
    .then(j => { st.list = (j.ok && j.data && j.data.activities) ? j.data.activities : []; render(); })
    .catch(() => { document.getElementById('dm-cal-body').textContent = '行事曆載入失敗，請稍後重新整理。'; });
})();
</script>
<!-- ===== 招生活動行事曆 結束 ===== -->
